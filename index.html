    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --gold: #f0c040;
            --text: #f0e6d3;
            --accent: #e2b04a;
            --border: #3a3050;
            --shadow: 0 10px 30px rgba(0,0,0,0.45);
            --radius: 22px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 20%, #2a2040 0%, transparent 55%),
                              radial-gradient(ellipse at 80% 70%, #1e2a3a 0%, transparent 55%);
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top, 16px);
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .game-container {
            display: flex;
            gap: 28px;
            max-width: 1080px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
        }
        .quiz-panel {
            flex: 1 1 420px;
            max-width: 520px;
            min-width: 340px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 26px 22px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .game-title {
            font-family: 'Limelight', 'Broadway BT', 'Broadway', cursive;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #f0c040, #ff6b8a, #7ec8e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.88rem;
            backdrop-filter: blur(4px);
        }
        .badge-coin { background: rgba(240,192,64,0.18); border: 1.5px solid rgba(240,192,64,0.5); color: #fde28b; }
        .badge-sticker { background: rgba(255,160,100,0.18); border: 1.5px solid rgba(255,160,100,0.5); color: #ffb888; }
        .badge-spin { background: rgba(255,130,180,0.18); border: 1.5px solid rgba(255,150,190,0.5); color: #ffb8d0; }
        .badge-progress { background: rgba(140,180,220,0.15); border: 1.5px solid rgba(140,180,220,0.4); color: #bcd4f0; font-size:0.8rem; }
        .question-box {
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .question-emoji { font-size: 2.2rem; }
        .question-text { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .tag { font-size: 0.7rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
        .tag-cn { background: rgba(100,180,255,0.2); color: #8cc4ff; }
        .tag-en { background: rgba(255,160,100,0.2); color: #ffb888; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: #e8e0d5;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            font-family: var(--font);
        }
        .option-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.35); transform: translateY(-2px); }
        .option-btn.correct { background: rgba(92,184,120,0.35); border-color: #5cb878; }
        .option-btn.wrong { background: rgba(224,85,85,0.35); border-color: #e05555; animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform: translateX(0);} 20%{transform: translateX(-5px);} 40%{transform: translateX(5px);} 60%{transform: translateX(-3px);} 80%{transform: translateX(3px);} }
        .btn-skip {
            padding: 10px 18px;
            border-radius: 40px;
            border: 2px solid rgba(240,192,64,0.5);
            background: rgba(240,192,64,0.1);
            color: #fde28b;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
        }
        .btn-skip:disabled { opacity: 0.4; cursor: not-allowed; }
        .feedback-msg { min-height: 24px; font-weight: 700; text-align: center; }
        .wheel-panel {
            flex: 0 1 450px;
            min-width: 350px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px 20px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .wheel-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
        }
        .wheel-spin-container { width: 100%; height: 100%; border-radius: 50%; transition: none; }
        canvas { width: 100%; height: 100%; display: block; border-radius: 50%; }
        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #ff4757;
            filter: drop-shadow(0 4px 8px rgba(255,71,87,0.5));
        }
        .center-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 48px; height: 48px;
            background: radial-gradient(circle, #fff 0%, #e8d5b0 50%, #c4a060 100%);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 3px solid #b89050;
        }
        .btn-spin {
            padding: 14px 36px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #ff6b8a, #e8456b);
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(232,69,107,0.4);
            font-family: var(--font);
            transition: 0.2s;
        }
        .btn-spin:disabled { background: #5a5a6e; cursor: not-allowed; box-shadow: none; opacity: 0.6; }
        .btn-spin.ready { animation: glowPulse 1.8s infinite; }
        @keyframes glowPulse { 0%,100%{ box-shadow: 0 6px 20px rgba(232,69,107,0.4); } 50%{ box-shadow: 0 6px 40px rgba(255,100,140,0.85); } }
        .collect-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .collect-item {
            font-size: 1.4rem;
            padding: 4px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0.4;
            transition: 0.2s;
        }
        .collect-item.collected { opacity: 1; border-color: var(--gold); background: rgba(240,192,64,0.15); box-shadow: 0 0 12px rgba(240,192,64,0.3); }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-dialog {
            background: #1e2840;
            border-radius: 22px;
            padding: 28px 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            animation: popIn 0.3s;
        }
        @keyframes popIn { from{transform: scale(0.8); opacity:0;} to{transform: scale(1); opacity:1;} }
        .modal-emoji { font-size: 3.5rem; }
        .modal-title { font-size: 1.5rem; font-weight: 800; margin: 8px 0; }
        .modal-btn {
            padding: 12px 30px; border-radius: 40px; border: none;
            background: var(--accent); color: #1a1a2e; font-weight: 700;
            cursor: pointer; margin-top: 12px;
        }
        .particles-container { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 99; }
        .particle {
            position: absolute; font-size: 1.8rem;
            animation: particleFall 1.2s ease-out forwards;
        }
        @keyframes particleFall { 0%{opacity:1; transform: translateY(0) rotate(0deg);} 100%{opacity:0; transform: translateY(160px) rotate(360deg);} }
        @media (max-width: 768px) {
            .game-container { flex-direction: column; align-items: center; }
            .wheel-wrapper { width: 280px; height: 280px; }
        }
    </style>

<script>
// ---------- 注册 Service Worker 实现离线缓存 ----------
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register("data:application/javascript," + encodeURIComponent(
            `self.addEventListener('install',e=>{e.waitUntil(caches.open('gaga-v1').then(c=>c.addAll([location.href])))})` +
            `self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`
        )).catch(err => console.log('SW 注册失败（可能不支持内联 worker）', err));
    });
}
</script>

<script>
(function(){
    // ---------- 游戏状态 ----------
    let coins = 5;          // 金币，用于跳过题目
    let stickers = 0;       // 贴纸，转盘奖励获得
    let spinChances = 0;
    let isSpinning = false;
    let currentAngle = 0;
    let quizLocked = false;
    let questionPool = [];
    let currentQuestion = null;

    const specialFour = ['谁能想到呢🍑', '哥本哈根隔离🍺', '🎉喵喵嗷嗷嗷😼', '🔮hi～蔑时陈'];
    let collected = {};
    specialFour.forEach(k => collected[k] = false);
    let sectorHitCounts = {};

    // DOM 元素
    const $coin = document.getElementById('coinCount');
    const $sticker = document.getElementById('stickerCount');
    const $spinBadge = document.getElementById('spinChancesBadge');
    const $spinText = document.getElementById('spinChancesText');
    const $questionRemain = document.getElementById('questionRemaining');
    const $qEmoji = document.getElementById('questionEmoji');
    const $qTag = document.getElementById('questionTag');
    const $qText = document.getElementById('questionText');
    const $optionsGrid = document.getElementById('optionsGrid');
    const $btnSkip = document.getElementById('btnSkip');
    const $feedback = document.getElementById('feedbackMsg');
    const $btnSpin = document.getElementById('btnSpin');
    const $wheelContainer = document.getElementById('wheelSpinContainer');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const $modalOverlay = document.getElementById('modalOverlay');
    const $modalDialog = document.getElementById('modalDialog');
    const $particles = document.getElementById('particlesContainer');
    const $collectGrid = document.getElementById('collectGrid');

    // ---------- 获取每个标签对应的弹窗 emoji ----------
    function getEmojiForLabel(label){
        const map = {
            '快乐说hi hi🌈': '🌈',
            '🥳豪俾你～': '🥳',
            '谁能想到呢🍑': '🍑',
            '生日快乐🎂': '🎂',
            '哥本哈根隔离🍺': '🍺',
            '🎉喵喵嗷嗷嗷😼': '😼',
            '🪙Go to猪': '🪙',
            '🔮hi～蔑时陈': '🔮',
            '🚨‼️MariaGa~': '🔓'
        };
        return map[label] || '✨';
    }

    // ---------- 动态生成扇区 ----------
    function getSectorDefinitions(){
        const isActivated = specialFour.every(k => collected[k]);
        const basePct = {
            '快乐说hi hi🌈': 13,
            '🥳豪俾你～': 18,
            '谁能想到呢🍑': 8.5,
            '生日快乐🎂': 22,
            '哥本哈根隔离🍺': 8.5,
            '🎉喵喵嗷嗷嗷😼': 8.5,
            '🪙Go to猪': 13,
            '🔮hi～蔑时陈': 8.5
        };
        const order = [
            '快乐说hi hi🌈',
            '谁能想到呢🍑',
            '🪙Go to猪',
            '哥本哈根隔离🍺',
            '生日快乐🎂',
            '🎉喵喵嗷嗷嗷😼',
            '🥳豪俾你～',
            '🔮hi～蔑时陈'
        ];

        let sectors = [];
        if (isActivated) {
            const remainingDeg = 180;
            let cum = 0;
            for (let label of order) {
                const angleDeg = (basePct[label] / 100) * remainingDeg;
                const start = cum;
                const end = cum + angleDeg;
                cum = end;
                sectors.push({
                    label, angle: angleDeg, start, end,
                    color: getColor(label), light: getLightColor(label),
                    rewardType: getRewardType(label), emoji: getEmojiForLabel(label)
                });
            }
            sectors.push({
                label: '🚨‼️MariaGa~', angle: 180, start: cum, end: cum + 180,
                color: '#ff6b8a', light: '#ff9ab5', rewardType: 'retrySecond', emoji: '🔓'
            });
        } else {
            let cum = 0;
            for (let label of order) {
                const angleDeg = basePct[label] * 3.6;
                const start = cum;
                const end = cum + angleDeg;
                cum = end;
                sectors.push({
                    label, angle: angleDeg, start, end,
                    color: getColor(label), light: getLightColor(label),
                    rewardType: getRewardType(label), emoji: getEmojiForLabel(label)
                });
            }
        }
        return sectors;
    }

    function getColor(label){
        const map = {
            '快乐说hi hi🌈': '#f0c040', '🥳豪俾你～': '#7ec8e3', '谁能想到呢🍑': '#a8ddf0',
            '生日快乐🎂': '#f7b731', '哥本哈根隔离🍺': '#6ec6a0', '🎉喵喵嗷嗷嗷😼': '#c9a0dc',
            '🪙Go to猪': '#b8a090', '🔮hi～蔑时陈': '#e8d870', '🚨‼️MariaGa~': '#ff6b8a'
        };
        return map[label] || '#888';
    }
    function getLightColor(label){
        const map = {
            '快乐说hi hi🌈': '#fde28b', '🥳豪俾你～': '#bcd4f0', '谁能想到呢🍑': '#cceeff',
            '生日快乐🎂': '#fcd278', '哥本哈根隔离🍺': '#95d9bb', '🎉喵喵嗷嗷嗷😼': '#ddc0ed',
            '🪙Go to猪': '#d4c5b5', '🔮hi～蔑时陈': '#f2e89a', '🚨‼️MariaGa~': '#ff9ab5'
        };
        return map[label] || '#aaa';
    }

    function getRewardType(label){
        if (label === '快乐说hi hi🌈' || label === '生日快乐🎂') return 'coins1';
        if (label === '🥳豪俾你～') return 'retry';
        if (label === '🪙Go to猪') return null;
        return 'retrySecond';
    }

    let sectors = [];
    let boundaries = [];

    function updateSectors(){
        sectors = getSectorDefinitions();
        boundaries = sectors.map(s => ({...s}));
    }

    function drawWheel(){
        updateSectors();
        const cx=200, cy=200, r=192;
        ctx.clearRect(0,0,400,400);
        ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2); ctx.fillStyle='#3a3050'; ctx.fill();
        ctx.beginPath(); ctx.arc(cx,cy,r+2,0,Math.PI*2); ctx.fillStyle='#5a4a70'; ctx.fill();
        let startRad = -Math.PI/2;
        sectors.forEach(s => {
            const ang = s.angle/360*Math.PI*2;
            const endRad = startRad+ang;
            const mid = startRad+ang/2;
            const grad = ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r);
            grad.addColorStop(0, s.light); grad.addColorStop(1, s.color);
            ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,startRad,endRad); ctx.closePath();
            ctx.fillStyle = grad; ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
            const tx = cx+Math.cos(mid)*r*0.68, ty = cy+Math.sin(mid)*r*0.68;
            ctx.save(); ctx.translate(tx,ty); ctx.rotate(mid+Math.PI/2);
            ctx.fillStyle='#1a1a2e';
            let fontSize = s.angle > 120 ? 14 : s.angle > 40 ? 11 : 8;
            ctx.font = `bold ${fontSize}px "PingFang SC","Microsoft YaHei"`;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(s.label,0,0);
            ctx.restore();
            startRad = endRad;
        });
        const ig = ctx.createRadialGradient(cx,cy,0,cx,cy,30);
        ig.addColorStop(0,'#fff'); ig.addColorStop(0.5,'#f0e0c0'); ig.addColorStop(1,'#c8a870');
        ctx.beginPath(); ctx.arc(cx,cy,26,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
        ctx.strokeStyle='#b89050'; ctx.lineWidth=2; ctx.stroke();
        for(let i=0;i<24;i++){
            const a = i/24*Math.PI*2-Math.PI/2;
            ctx.beginPath(); ctx.arc(cx+Math.cos(a)*(r-1), cy+Math.sin(a)*(r-1), 2.5, 0, Math.PI*2);
            ctx.fillStyle = i%2===0?'#fff':'#ffd700'; ctx.fill();
        }
    }

    function getSectorByAngle(totalDeg){
        let ptr = ((360 - totalDeg%360)%360+360)%360;
        for(let b of boundaries) {
            let s = b.start % 360, e = b.end % 360;
            if(e < s) e += 360;
            if(ptr >= s && ptr < e) return b;
            if(ptr+360 >= s && ptr+360 < e) return b;
        }
        return boundaries[boundaries.length-1];
    }

    function spin(){
        if(isSpinning || spinChances<=0) return;
        isSpinning=true; spinChances--; updateUI();
        $btnSpin.disabled=true; $btnSpin.classList.remove('ready');
        const extra = 5+Math.floor(Math.random()*6);
        const offset = Math.random()*360;
        const target = currentAngle + extra*360 + offset;
        const start = currentAngle;
        const duration = 4000+Math.random()*1500;
        const startTime = performance.now();
        function anim(now){
            const p = Math.min((now-startTime)/duration,1);
            const eased = 1 - Math.pow(1-p, 3.5);
            currentAngle = start + (target-start)*eased;
            $wheelContainer.style.transform = `rotate(${currentAngle}deg)`;
            if(p<1) requestAnimationFrame(anim);
            else {
                currentAngle = target;
                $wheelContainer.style.transform = `rotate(${target}deg)`;
                isSpinning = false;
                handleResult(getSectorByAngle(target));
            }
        }
        requestAnimationFrame(anim);
    }

    function handleResult(sector){

        if (!sectorHitCounts[label]) sectorHitCounts[label] = 0;

            else { $btnSpin.disabled=true; $btnSpin.classList.remove('ready'); }

        }

        if (sector.rewardType === 'retry') {
            spinChances++;
            updateUI();
            spawnParticles('🥳',15);
            showModal('🥳','🥳豪俾你～！','获得额外一次转盘机会！','继续');
        } else if (sector.rewardType === null) {
            spawnParticles('💨',8);

        } else if (sector.rewardType === 'coins1') {
            stickers += 1;
            updateUI();
            spawnParticles('🎖️',8);
            showModal(sector.emoji, label, '获得 <b>1贴纸</b>！','好的');
        } else if (sector.rewardType === 'retrySecond') {
            if (times === 1) {
                if (specialFour.includes(label)) {
                    collected[label] = true;
                    updateCollectGrid();
                    if (specialFour.every(k => collected[k])) {
                        spawnParticles('✨',6);
                        showModal(sector.emoji, label, 'wow wow wow~~', '好的', () => {
                            drawWheel();
                            spawnParticles('🔓✨',10);

                        });

                        else { $btnSpin.disabled=true; $btnSpin.classList.remove('ready'); }
                        return;
                    }
                }
                spawnParticles('✨',6);
                showModal(sector.emoji, label, 'wow wow wow~~','好的');
            } else {
                spinChances++;
                updateUI();
                spawnParticles('🔄🥳',12);
                showModal(sector.emoji, label, '获得一次<b>重抽机会</b>！','再来一次');
            }
        }

        if(spinChances>0 && !isSpinning) { $btnSpin.disabled=false; $btnSpin.classList.add('ready'); }
        else { $btnSpin.disabled=true; $btnSpin.classList.remove('ready'); }
    }

    function spawnParticles(emojiStr, count){
        const rect = document.getElementById('wheelWrapper').getBoundingClientRect();

        for(let i=0;i<count;i++){
            const p = document.createElement('span');
            p.className='particle';
            p.textContent=emojis[Math.floor(Math.random()*emojis.length)]||'✨';
            p.style.left = (cx+(Math.random()-0.5)*200)+'px';
            p.style.top = (cy+(Math.random()-0.5)*100)+'px';

            setTimeout(()=>p.remove(), 1300);

    // ---------- 题库（含新增刑法和高中文科题目，答案均匀分布） ----------
    function redistributeAnswers(questions) {
        let targetAns = 0;
        return questions.map(q => {
            const correctText = q.opts[q.ans];
            const wrongTexts = q.opts.filter((_, idx) => idx !== q.ans);
            const newOpts = [];
            for (let i = 0; i < 4; i++) {
                if (i === targetAns) {
                    newOpts.push(correctText);
                } else {
                    newOpts.push(wrongTexts.shift());
                }
            }
            q.opts = newOpts;
            q.ans = targetAns;
            targetAns = (targetAns + 1) % 4;
            return q;
        });
    }

    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

    function loadQuestion(){
        if(questionPool.length === 0) {
            questionPool = shuffle(buildPool());
        }
        currentQuestion = questionPool.pop();
        renderQuestion();
        quizLocked=false;
        $btnSkip.disabled=false;
        $feedback.textContent='';
    }

    function renderQuestion(){
        if(!currentQuestion) return;
        $qEmoji.textContent=currentQuestion.emoji;
        $qTag.textContent=currentQuestion.type==='en'?'English':'常识';
        $qTag.className='tag '+(currentQuestion.type==='en'?'tag-en':'tag-cn');
        $qText.textContent=currentQuestion.q;
        $optionsGrid.innerHTML = currentQuestion.opts.map((opt,i)=>
            `<button class="option-btn" data-idx="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`
        ).join('');
        document.querySelectorAll('.option-btn').forEach(btn=>{
            btn.onclick = ()=> handleAnswer(parseInt(btn.dataset.idx));
        });
    }

    function handleAnswer(idx){
        if(quizLocked || !currentQuestion) return;
        quizLocked=true;
        const correct = currentQuestion.ans;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b=>b.disabled=true);
        $btnSkip.disabled=true;
        if(idx===correct){
            btns[idx].classList.add('correct');
            spinChances++;
            $feedback.innerHTML='✅ 正确！获得1次转盘机会！';
            if(Math.random() < 0.15){
                stickers++;
                $feedback.innerHTML += ' 还额外获得🎖️1贴纸！';
            }
            $feedback.style.color='#5cb878';
            spawnParticles('🎉',8);
        } else {
            btns[idx].classList.add('wrong');
            btns[correct].classList.add('correct');
            $feedback.innerHTML='❌ 错误，正确答案是 '+currentQuestion.opts[correct];
            $feedback.style.color='#e05555';
        }
        updateUI();
        setTimeout(loadQuestion, 1800);
    }

    function skipQuestion(){
        if(quizLocked || !currentQuestion) return;
        if(coins<=0){ $feedback.innerHTML='金币不足！'; $feedback.style.color='#e05555'; return; }
        coins--;
        updateUI();
        questionPool.push(currentQuestion);
        loadQuestion();
        $feedback.innerHTML='⏭️ 已跳过，消耗1金币';
        $feedback.style.color='#f0c040';
    }

    function updateUI(){
        $coin.textContent=coins;

        $spinText.textContent=spinChances;
        $questionRemain.textContent = questionPool.length + (currentQuestion?1:0);
        $btnSkip.disabled = quizLocked || coins <= 0;
        if(spinChances>0 && !isSpinning) { $btnSpin.disabled=false; $btnSpin.classList.add('ready'); }
        else { $btnSpin.disabled=true; $btnSpin.classList.remove('ready'); }
    }

    setInterval(() => {
        if (!quizLocked && coins === 0 && spinChances === 0) {
            coins = 1;
            updateUI();
            $feedback.innerHTML = '⏰ 赠送1金币，继续挑战吧！';
            $feedback.style.color = '#f0c040';
        }
    }, 60000);

    $btnSpin.onclick=spin;
    $btnSkip.onclick=skipQuestion;
    document.addEventListener('keydown',e=>{
        if(quizLocked) return;
        if(e.key==='1') handleAnswer(0);
        if(e.key==='2') handleAnswer(1);
        if(e.key==='3') handleAnswer(2);
        if(e.key==='4') handleAnswer(3);
        if(e.key==='s'||e.key==='S') skipQuestion();
        if(e.key===' ' && spinChances>0 && !isSpinning){ e.preventDefault(); spin(); }
    });

    questionPool = shuffle(buildPool());
    loadQuestion();
    updateUI();
    updateCollectGrid();
    $wheelContainer.style.transform = 'rotate(0deg)';
    drawWheel();
})();
